<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InvoiceLens Workspace</title>
  <link rel="stylesheet" href="/styles.css?v=20260708" />
</head>
<body data-auth-state="signed-out" data-bootstrap-state="pending">
  <div class="bootstrap-overlay" aria-hidden="true"></div>
  <div class="app-shell" data-sidebar="expanded">
    <header class="topbar" aria-label="Application header">
      <div class="brand-area">
        <button class="icon-button sidebar-toggle" type="button" data-action="toggle-sidebar" aria-label="Toggle menu">
          <span class="hamburger" aria-hidden="true"></span>
        </button>
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Invoice<span>Lens</span></span>
      </div>

      <form class="global-search" role="search" data-action="global-search-submit">
        <span aria-hidden="true" class="search-glyph">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16.2 16.2 20 20"></path>
          </svg>
        </span>
        <input id="globalSearch" type="search" placeholder="Search invoices, vendors, AFE, or company..." autocomplete="off" />
        <kbd>Ctrl K</kbd>
      </form>

      <div class="top-actions" aria-label="User actions">
        <button class="icon-button notification-button" type="button" data-route="notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M15 17H9a3 3 0 0 1-3-3V11a6 6 0 1 1 12 0v3a3 3 0 0 1-3 3Z"></path>
            <path d="M10 17a2 2 0 0 0 4 0"></path>
          </svg>
          <span class="notify-badge">6</span>
        </button>
        <button class="icon-button" type="button" data-route="help" aria-label="Help">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M9.6 9a2.4 2.4 0 1 1 4.8 0c0 1.6-2.4 1.9-2.4 3.4"></path>
            <circle cx="12" cy="17" r="1"></circle>
          </svg>
        </button>
        <button class="icon-button" type="button" aria-label="Settings" data-route="admin">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19 12a7.1 7.1 0 0 0-.1-1l2-1.6-2-3.5-2.4.8a7 7 0 0 0-1.8-1L14 2h-4l-.7 3.7a7 7 0 0 0-1.8 1l-2.4-.8-2 3.5 2 1.6A7.1 7.1 0 0 0 5 12c0 .3 0 .6.1 1l-2 1.6 2 3.5 2.4-.8a7 7 0 0 0 1.8 1L10 22h4l.7-3.7a7 7 0 0 0 1.8-1l2.4.8 2-3.5-2-1.6c.1-.3.1-.6.1-1Z"></path>
          </svg>
        </button>
        <button class="profile-button" type="button" data-action="profile-auth" aria-label="User profile">
          <span class="profile-avatar" aria-hidden="true">
            <img class="profile-avatar-image" alt="" />
            <span class="profile-avatar-fallback">IN</span>
          </span>
          <span class="profile-copy">
            <strong>Sign in</strong>
            <small>Microsoft account</small>
          </span>
        </button>
      </div>
    </header>

    <aside class="sidebar" aria-label="Primary navigation">
      <nav class="side-nav">
        <a class="nav-item active" href="/" data-route="dashboard">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
          </span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-item" href="/invoices" data-route="invoices">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="4" y="4" width="16" height="16" rx="2"></rect>
              <path d="M8 8h8M8 12h8M8 16h6"></path>
            </svg>
          </span>
          <span class="nav-label">Invoices</span>
        </a>
        <a class="nav-item" href="/comparison" data-route="comparison">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M7 5h10M7 12h10M7 19h10"></path>
              <path d="M5 7l2-2 2 2M5 14l2-2 2 2M5 21l2-2 2 2"></path>
            </svg>
          </span>
          <span class="nav-label">Comparison</span>
        </a>
        <a class="nav-item" href="/compliance-queue" data-route="compliance-queue">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="4" y="4" width="16" height="16" rx="2"></rect>
              <path d="m8.2 12.4 2.2 2.2 5.5-6"></path>
            </svg>
          </span>
          <span class="nav-label">Review Queue</span>
          <span class="nav-count" data-count="queue">0</span>
        </a>
        <a class="nav-item" href="/validation-summary" data-route="validation-summary">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 12.5 9.2 17 19 7"></path>
            </svg>
          </span>
          <span class="nav-label">Validation Summary</span>
        </a>
        <a class="nav-item" href="/admin" data-route="admin">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19 12a7.1 7.1 0 0 0-.1-1l2-1.6-2-3.5-2.4.8a7 7 0 0 0-1.8-1L14 2h-4l-.7 3.7a7 7 0 0 0-1.8 1l-2.4-.8-2 3.5 2 1.6A7.1 7.1 0 0 0 5 12c0 .3 0 .6.1 1l-2 1.6 2 3.5 2.4-.8a7 7 0 0 0 1.8 1L10 22h4l.7-3.7a7 7 0 0 0 1.8-1l2.4.8 2-3.5-2-1.6c.1-.3.1-.6.1-1Z"></path>
            </svg>
          </span>
          <span class="nav-label">Admin Settings</span>
        </a>
      </nav>

      <button class="collapse-button" type="button" data-action="toggle-sidebar">
        <span aria-hidden="true">‹</span>
        <span class="nav-label">Collapse</span>
      </button>
    </aside>

    <main class="page-host" id="pageHost" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/runtime-config.js"></script>
  <script src="/vendor/chart.umd.js"></script>
  <script type="module" src="/main.js?v=20260702"></script>
</body>
</html>
