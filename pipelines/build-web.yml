jobs:
- job: BuildWeb
  displayName: Build Web
  steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'

  - script: |
      cd apps/web
      npm ci
      npm run build
    displayName: Build TypeScript Web

  - task: Docker@2
    displayName: Build and push immutable web image
    inputs:
      containerRegistry: '$(AcrServiceConnection)'
      repository: invoicelens-web
      command: buildAndPush
      Dockerfile: apps/web/Dockerfile
      buildContext: apps/web
      tags: |
        $(Build.BuildId)
        $(Build.SourceVersion)
